[package]
name = "pirust-orchestrator"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Daemon supervising headless pirust workers — pirust port of @earendil-works/pi-orchestrator"

[[bin]]
name = "pirust-orchestrator"
path = "src/main.rs"

# Also a library so golden suites can exercise the protocol/server layers
# without spawning the binary (same pattern as pirust-coding-agent).
[lib]
name = "pirust_orchestrator"
path = "src/lib.rs"

[dependencies]
serde = { workspace = true }
# preserve_order: test fixtures round-trip real Pi's JSON key order (schemas.ts
# field declaration order / real construction-site literal order) — a plain
# BTreeMap-backed serde_json::Value would silently re-sort keys alphabetically.
serde_json = { workspace = true, features = ["preserve_order"] }
anyhow = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }  # ByteConnection/PiServerListener traits (Wave 3)
futures = { workspace = true }      # Promise.all-equivalent concurrent awaits (Wave 4b)
# Wave 4b: server-assigned session/connection/server ids (`randomUUID()` in
# sessions.ts/server.ts is a v4 UUID, not the agent-core session tree's v7 —
# pirust-orchestrator has no dependency on pirust-agent-core, so this is a
# fresh, minimal dep, not a duplicate of uuid.rs's v7 generator). Already
# resolved transitively at 1.24.0 (Cargo.lock) via other workspace members.
uuid = { version = "1", features = ["v4"] }
# Wave 5: transports/unix's owned-bind-path hashing (getOwnedBindPath).
sha2 = { workspace = true }
# Wave 6: the real AgentHarness-backed PiServerService + runnable binary —
# a pirust-side addition, not a port (plan.md/feature_list.json both say
# so). Reuses pirust-coding-agent's sdk.rs (harness assembly, model/auth
# resolution) rather than reimplementing it.
pirust-agent-core = { workspace = true }
pirust-ai = { workspace = true }
pirust-coding-agent = { workspace = true }
tokio-util = { workspace = true } # CancellationToken, matching agent-core's own use

[dev-dependencies]
# Wave 5: tests/unix_transport.rs (`#[cfg(unix)]`) needs real scratch
# directories for socket-file lifecycle scenarios, same as pirust-tools'
# existing use for fixture rebuilding.
tempfile = { workspace = true }
