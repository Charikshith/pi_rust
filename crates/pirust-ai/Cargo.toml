[package]
name = "pirust-ai"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Unified multi-provider LLM API — pirust port of @earendil-works/pi-ai"

[dependencies]
serde = { workspace = true }
# preserve_order: arbitrary JSON objects (tool-call arguments, headers, metadata) keep
#   insertion order, matching JS object key order for byte-identical serialization.
# raw_value: lets jsnum emit JS-compatible number literals verbatim.
# float_roundtrip: correctly-rounded float parsing so an f64 survives parse->serialize
#   bit-for-bit (default serde_json parser can be off by 1 ULP, breaking byte-compat).
serde_json = { workspace = true, features = ["preserve_order", "raw_value", "float_roundtrip"] }
thiserror = { workspace = true }

# feat-002 Anthropic streaming runtime (docs/analysis/06-anthropic-runtime-spec.md §Crates).
# tokio: mpsc/oneshot channels for the event stream, spawn for the producer IIFE.
tokio = { workspace = true }
# reqwest: HTTP + SSE byte stream over rustls (no OpenSSL); default features off.
reqwest = { workspace = true }
# futures: Stream/StreamExt for the event stream and the byte stream.
futures = { workspace = true }
# bytes: reqwest::Response::bytes_stream() yields Bytes.
bytes = { workspace = true }
# base64: image `data` handling in message conversion (convertContentBlocks).
base64 = { workspace = true }
# tokio-util codec: optional line framing of the byte stream. `sync::CancellationToken`
# is always available (no feature gate) and backs the abortable retry backoff.
tokio-util = { workspace = true, features = ["codec"] }

[dev-dependencies]
# test-util: mocked time / test runtime for the event-stream + adapter oracle tests.
tokio = { workspace = true, features = ["test-util"] }
